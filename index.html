  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{
      width:100%;height:100%;background:#0a0a0a;overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
    }
    #overlay{
      position:fixed;inset:0;background:#0a0a0a;z-index:9999;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:16px
    }
    #overlay svg{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #overlay p{
      color:#505050;font-size:12px;letter-spacing:.5px;
      text-align:center;padding:0 24px;font-weight:500
    }

    /* ─── CHANNEL LIST ─── */
    #channel-list{
      position:fixed;inset:0;background:#0a0a0a;z-index:9998;
      display:none;flex-direction:column;overflow-y:auto;
      padding:max(20px,env(safe-area-inset-top)) 16px
              max(20px,env(safe-area-inset-bottom)) 16px
    }
    #ch-header{
      display:flex;align-items:center;justify-content:center;
      gap:10px;margin-bottom:20px;padding-bottom:14px;
      border-bottom:1px solid #181818
    }
    .brand-dot{
      width:8px;height:8px;border-radius:50%;background:#38bdf8;
      flex-shrink:0;box-shadow:0 0 8px rgba(56,189,248,.55);
      animation:brand-pulse 2.2s ease-in-out infinite
    }
    @keyframes brand-pulse{
      0%,100%{opacity:1;box-shadow:0 0 8px rgba(56,189,248,.55)}
      50%{opacity:.65;box-shadow:0 0 16px rgba(56,189,248,.85)}
    }
    #ch-header h1{color:#e0e0e0;font-size:15px;font-weight:600;letter-spacing:.8px}

    /* Search bar */
    #search-wrap{position:relative;margin-bottom:16px}
    #search-input{
      width:100%;padding:12px 42px 12px 18px;
      background:#111;border:1px solid #1f1f1f;border-radius:30px;
      color:#e0e0e0;font-size:14px;outline:none;
      transition:border-color .2s,box-shadow .2s;
      font-family:inherit;
    }
    #search-input::placeholder{color:#555;font-weight:400}
    #search-input:focus{border-color:#38bdf8;box-shadow:0 0 0 2px rgba(56,189,248,.15)}
    #search-icon{
      position:absolute;right:16px;top:50%;transform:translateY(-50%);
      color:#555;pointer-events:none;display:flex;align-items:center;
    }
    #search-clear{
      position:absolute;right:42px;top:50%;transform:translateY(-50%);
      background:none;border:none;color:#555;cursor:pointer;
      display:none;padding:4px;font-size:16px;line-height:1;
    }
    #search-clear:hover{color:#aaa}

    /* Category chips */
    #cat-scroll{
      display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;
      scrollbar-width:none;-ms-overflow-style:none;
      -webkit-overflow-scrolling:touch;flex-shrink:0;
      margin:0 -16px;padding-left:16px;padding-right:16px;
    }
    #cat-scroll::-webkit-scrollbar{display:none}
    .cat-chip{
      flex-shrink:0;padding:8px 18px;border-radius:20px;
      background:#141414;border:1px solid #222;
      color:#999;font-size:12px;font-weight:500;
      cursor:pointer;white-space:nowrap;
      transition:background .18s,border-color .18s,color .18s;
      -webkit-tap-highlight-color:transparent;
    }
    .cat-chip:hover{background:#1c1c1c;border-color:#2e2e2e;color:#ccc}
    .cat-chip.active{
      background:linear-gradient(135deg,#1e3a5f,#0f2a4a);
      border-color:#38bdf8;color:#7dd3fc;
      box-shadow:0 0 12px rgba(56,189,248,.15);
    }

    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:10px
    }
    .ch-card{
      background:#111;border:1px solid #1c1c1c;border-radius:10px;
      padding:16px 12px;cursor:pointer;text-decoration:none;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;gap:10px;
      transition:background .18s,border-color .18s,transform .12s;
      -webkit-tap-highlight-color:transparent;min-height:130px;
      position:relative
    }
    .ch-card:hover{background:#161616;border-color:#282828}
    .ch-card:active{transform:scale(.95);background:#1c1c1c}
    .ch-card:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
    .ch-card span{color:#d8d8d8;font-size:12px;font-weight:500;line-height:1.4;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
      overflow:hidden;max-height:34px;width:100%}
    .ch-logo{
      width:100%;max-width:90px;height:50px;object-fit:contain;
      border-radius:6px;flex-shrink:0;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))
    }
    .ch-logo-fallback{
      width:90px;height:50px;border-radius:6px;
      background:linear-gradient(135deg,#1a1a2e,#16213e);
      border:1px solid #2a2a4a;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;font-weight:800;color:#38bdf8;
      letter-spacing:1px;flex-shrink:0
    }
    .ch-group-badge{
      position:absolute;top:6px;right:6px;
      font-size:8px;font-weight:700;letter-spacing:.4px;
      padding:2px 6px;border-radius:4px;
      background:rgba(56,189,248,.12);color:#38bdf8;
      border:1px solid rgba(56,189,248,.2);
      text-transform:uppercase;max-width:70px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    #no-results{
      display:none;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;padding:60px 20px;color:#444;text-align:center
    }
    #no-results svg{opacity:.3}
    #no-results p{font-size:14px;font-weight:500}

    @media(max-width:480px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
      .ch-card{padding:12px 8px;min-height:110px;border-radius:8px}
      .ch-logo,.ch-logo-fallback{max-width:70px;height:40px}
      .ch-logo-fallback{font-size:14px}
      .ch-card span{font-size:10px;max-height:28px}
      #search-input{font-size:13px;padding:10px 38px 10px 14px}
      .cat-chip{padding:6px 14px;font-size:11px}
      .ch-group-badge{font-size:7px;padding:1px 4px;max-width:50px}
    }

    /* ─── PLAYER ─── */
    #pc{
      position:fixed;inset:0;background:#000;display:none;
      align-items:center;justify-content:center;touch-action:manipulation
    }
    video{width:100%;height:100%;object-fit:contain;background:#000}
    video.mode-fill{object-fit:fill}
    video.mode-cover{object-fit:cover}
    #status{
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      right:12%;
      transform:translateY(-10px);
      z-index:9997;
      display:flex;align-items:center;gap:7px;
      padding:6px 15px 6px 11px;
      background:rgba(10,10,10,.92);
      border:1px solid rgba(255,255,255,.07);
      font-size:11.5px;font-weight:500;letter-spacing:.2px;
      border-radius:24px;pointer-events:none;opacity:0;
      transition:opacity .25s ease,transform .25s ease;
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;
      box-shadow:0 2px 14px rgba(0,0,0,.45)
    }
    #status.show{opacity:1;transform:translateY(0)}
    .st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
    #status.ok   {color:#c0c0c0} #status.ok   .st-dot{background:#60a5fa}
    #status.live {color:#c8c8c8} #status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
    #status.warn {color:#fcd34d} #status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
    #status.err  {color:#fca5a5} #status.err  .st-dot{background:#f87171}
    @keyframes dot-pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.35;transform:scale(.55)}
    }
    .sp-btn{
      background:transparent!important;border:none!important;
      cursor:pointer!important;padding:0 8px!important;
      opacity:.75;display:flex;align-items:center;justify-content:center;
      height:100%;min-width:36px;
      transition:opacity .15s,color .15s;
      color:#fff!important;-webkit-tap-highlight-color:transparent
    }
    .sp-btn:hover{opacity:1}
    .sp-btn:active{opacity:1;transform:scale(.9)}
    .sp-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:6px}
    .sp-btn.active{opacity:1;color:#38bdf8!important}
    .sp-fit-btn{padding:0 7px!important;min-width:auto!important}
    .fit-pill{
      font-size:10px;font-weight:700;letter-spacing:.4px;
      padding:3px 7px;border-radius:4px;line-height:1;
      border:1.5px solid rgba(255,255,255,.28);
      color:rgba(255,255,255,.8);
      pointer-events:none;white-space:nowrap;
      transition:border-color .2s,color .2s
    }
    .sp-fit-btn:hover      .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
    .sp-fit-btn.mode-fill  .fit-pill{border-color:#38bdf8;color:#38bdf8}
    .sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
    .shaka-controls-container button{color:#fff!important}
    .shaka-video-container{background-color:#000!important}
    @media(max-width:380px){
      .fit-pill{font-size:9px;padding:2px 5px}
      .sp-btn{padding:0 5px!important}
    }

    #tgBadge{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:10001;display:inline-flex;align-items:center;gap:10px;padding:11px 20px;background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;font-size:15px;font-weight:600;text-decoration:none;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .2s ease;font-family:'Inter',system-ui,sans-serif}
    #tgBadge:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(30,136,229,.55)}
    #tgBadge svg{width:20px;height:20px;flex-shrink:0;fill:#fff}
    #tgBadge span{white-space:nowrap}
    @media(max-width:480px){#tgBadge{padding:9px 15px;font-size:13px;gap:8px}#tgBadge svg{width:17px;height:17px}}
    @media(max-width:360px){#tgBadge span{display:none}#tgBadge{padding:9px 12px}}

    #tgOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center;z-index:999999;padding:20px}
    #tgOverlay.show{display:flex}
    #tgCard{width:100%;max-width:400px;background:linear-gradient(160deg,#121821,#0a0c0f);border:1px solid rgba(79,195,247,.15);border-radius:24px;padding:36px 28px 28px;box-shadow:0 40px 80px rgba(0,0,0,.8);text-align:center}
    #tgIcon{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2AABEE,#229ED9)}
    #tgIcon svg{width:36px;height:36px}
    #tgCard h2{margin:0 0 8px;font-size:1.5rem;font-weight:700;color:#fff;font-family:'Inter',system-ui,sans-serif}
    #tgCard p{margin:0 0 24px;color:#8e9baf;font-size:.95rem;line-height:1.6}
    .tgBtns{display:flex;gap:12px}
    .tgBtn{flex:1;height:48px;border-radius:40px;font-weight:700;font-size:.9rem;cursor:pointer;border:none;font-family:'Inter',system-ui,sans-serif}
    #joinNow{background:linear-gradient(135deg,#4fc3f7,#2196f3);color:#fff}
    #joinedBtn{background:rgba(255,255,255,.05);color:#8e9baf;border:1px solid rgba(255,255,255,.08)}
  </style>
</head>

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status  = document.getElementById("status");
var $list    = document.getElementById("channel-list");
var $grid    = document.getElementById("ch-grid");

var $vid     = document.getElementById("v");
var _stTmr   = null;

/* Search & category state */
var _allChannels = [];
var _activeCat   = "__all__";
var _searchTerm  = "";
var _catSet      = {};

function getTier(){
  var mem   = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var net   = conn ? (conn.effectiveType || "4g") : "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";
  return "high";
}

var TIER = getTier();

var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
  mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
  high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
}[TIER];

var FITS       = ["contain","fill","cover"];
var FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
function getChId()    { return new URLSearchParams(location.search).get("id") || ""; }

function rawCookie(c){
  return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
}
function withCookie(u, r){
  if(!u || !r) return u;
  if(u.indexOf("__hdnea__") !== -1) return u;
  return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
}

function isNonEmpty(v){
  return typeof v === "string" && v.trim().length > 0;
}

/* ═══════════ M3U PARSER — MULTI-KEY SUPPORT (COMMA-SEPARATED) ═══════════
   Handles lines like:
   #KODIPROP:inputstream.adaptive.license_key=KID1:KEY1,KID2:KEY2
   Also handles legacy single key: #KODIPROP:inputstream.adaptive.license_key=KID:KEY
*/
function parseM3U(text){
  var lines = text.split(/\r?\n/);
  var channels = [];
  var pending = null;

  function attrOf(line, key){
    var re = new RegExp(key + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s,]+))', 'i');
    var m = line.match(re);
    if(!m) return "";
    return (m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3])) || "";
  }

  for(var i = 0; i < lines.length; i++){
    var raw = lines[i];
    var line = raw.trim();
    if(!line) continue;

    if(/^#EXTINF:/i.test(line)){
      pending = {
        id:        attrOf(line, "tvg-id")   || "",
        name:      attrOf(line, "tvg-name") || "",
        logo:      attrOf(line, "tvg-logo") || "",
        group:     attrOf(line, "group-title") || "",
        stream_url: "",
        cookie:     "",
        sportlink:  [],   // holds ALL kid:key pairs (comma-separated ones split)
        headers:    {}
      };
      if(!pending.name){
        var comma = line.lastIndexOf(",");
        if(comma !== -1) pending.name = line.slice(comma + 1).trim();
      }
      continue;
    }

    if(!pending) continue;

    /* #KODIPROP — can appear multiple times; license_key may contain MULTIPLE comma-separated pairs */
    if(/^#KODIPROP:/i.test(line)){
      var lm = line.match(/license_key\s*=\s*(.+)$/i);
      if(lm){
        var licVal = lm[1].trim();
        // strip |headers suffix if present
        var barIdx = licVal.indexOf("|");
        if(barIdx !== -1) licVal = licVal.slice(0, barIdx);

        // ★ SPLIT on comma to support MULTIPLE key pairs in one line
        var pairs = licVal.split(",");
        pairs.forEach(function(pair){
          pair = pair.trim();
          if(!pair) return;
          if(pair.indexOf(":") !== -1){
            pending.sportlink.push(pair);
          }
        });
      }
      var sh = line.match(/stream_headers\s*=\s*(.+)$/i);
      if(sh){
        var hdrs = sh[1].trim();
        hdrs.split("&").forEach(function(pair){
          var eq = pair.indexOf("=");
          if(eq === -1) return;
          var k = pair.slice(0, eq).trim();
          var v = pair.slice(eq + 1).trim();
          if(k) pending.headers[k] = v;
          if(/cookie/i.test(k)) pending.cookie = v;
        });
      }
      continue;
    }

    if(/^#EXTVLCOPT:/i.test(line)){
      var ck = line.match(/http-cookie\s*=\s*(.+)$/i);
      if(ck) pending.cookie = ck[1].trim();
      var ua = line.match(/http-user-agent\s*=\s*(.+)$/i);
      if(ua) pending.headers["User-Agent"] = ua[1].trim();
      var rf = line.match(/http-referrer\s*=\s*(.+)$/i);
      if(rf) pending.headers["Referer"] = rf[1].trim();
      continue;
    }

    if(/^#EXTHTTP:/i.test(line)){
      try{
        var jsonStr = line.replace(/^#EXTHTTP:\s*/i, "");
        var obj = JSON.parse(jsonStr);
        Object.keys(obj).forEach(function(k){
          pending.headers[k] = obj[k];
          if(/cookie/i.test(k)) pending.cookie = obj[k];
        });
      }catch(_){}
      continue;
    }

    if(line.charAt(0) === "#") continue;

    if(!pending.stream_url){
      pending.stream_url = line;

      if(!pending.id){
        var m = line.match(/\/([^\/]+)\/index\.mpd/i);
        pending.id = m ? m[1] : ("ch" + channels.length);
      }
      if(!pending.name){
        pending.name = pending.id;
      }
      channels.push(pending);
      pending = null;
    }
  }

  return channels;
}

/* ═══════════ LOAD DATA ═══════════ */
async function loadData(){
  try {
    var r = await fetch(API, {cache:"no-store"});
    if(!r.ok) return { channels: [] };
    var txt = await r.text();
    var chans = parseM3U(txt);
    return { channels: chans };
  } catch(e) {
    return { channels: [] };
  }
}

/* ═══════════ RENDER LIST ═══════════ */
function renderList(channels){
  hideOverlay();
  _allChannels = channels;
  _activeCat = "__all__";
  _searchTerm = "";

  _catSet = {};
  channels.forEach(function(ch){
    var g = (ch.group || "").trim();
    if(g) _catSet[g] = true;
  });

  renderCategories();
  applyFilters();
  $list.style.display = "flex";
}

function renderCategories(){
  var $catScroll = document.getElementById("cat-scroll");
  if(!$catScroll) return;

  var cats = Object.keys(_catSet).sort();
  var html = '<button class="cat-chip active" data-cat="__all__">All</button>';
  cats.forEach(function(c){
    html += '<button class="cat-chip" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
  });
  $catScroll.innerHTML = html;

  $catScroll.querySelectorAll(".cat-chip").forEach(function(btn){
    btn.addEventListener("click", function(){
      $catScroll.querySelectorAll(".cat-chip").forEach(function(b){ b.classList.remove("active"); });
      this.classList.add("active");
      _activeCat = this.getAttribute("data-cat");
      applyFilters();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function applyFilters(){
  var term = _searchTerm.toLowerCase().trim();
  var cat  = _activeCat;

  var filtered = _allChannels.filter(function(ch){
    if(cat !== "__all__" && (ch.group || "").trim() !== cat) return false;
    if(term){
      var name = (ch.name || "").toLowerCase();
      var grp  = (ch.group || "").toLowerCase();
      if(name.indexOf(term) === -1 && grp.indexOf(term) === -1) return false;
    }
    return true;
  });

  var $noRes = document.getElementById("no-results");
  if(filtered.length === 0){
    $grid.innerHTML = "";
    $noRes.style.display = "flex";
    return;
  }
  $noRes.style.display = "none";

  $grid.innerHTML = "";
  var f = document.createDocumentFragment();

  filtered.forEach(function(ch){
    var a = document.createElement("a");
    a.className = "ch-card";
    a.href = "?id=" + encodeURIComponent(ch.id);

    if(ch.group && ch.group.trim()){
      var badge = document.createElement("span");
      badge.className = "ch-group-badge";
      badge.textContent = ch.group.trim();
      a.appendChild(badge);
    }

    var logoUrl = ch.logo || LOGO_MAP[ch.id] || "";
    var initials = (ch.name || "TV").split(" ").slice(0,2).map(function(w){return w[0]||'';}).join('');

    if (isNonEmpty(logoUrl)) {
      var img = document.createElement("img");
      img.className = "ch-logo";
      img.src = logoUrl;
      img.alt = ch.name;
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onerror = function() {
        this.style.display = "none";
        var fallback = document.createElement("div");
        fallback.className = "ch-logo-fallback";
        fallback.textContent = initials;
        if (this.parentNode) {
          this.parentNode.insertBefore(fallback, this);
        }
      };
      a.appendChild(img);
    } else {
      var fallback = document.createElement("div");
      fallback.className = "ch-logo-fallback";
      fallback.textContent = initials;
      a.appendChild(fallback);
    }

    var span = document.createElement("span");
    span.textContent = ch.name;
    a.appendChild(span);

    f.appendChild(a);
  });

  $grid.appendChild(f);
}

function setupSearch(){
  var $input = document.getElementById("search-input");
  var $clear = document.getElementById("search-clear");
  if(!$input || $input._bound) return;
  $input._bound = true;

  var debounceTmr = null;
  $input.addEventListener("input", function(){
    var v = this.value;
    if($clear) $clear.style.display = v ? "block" : "none";
    if(debounceTmr) clearTimeout(debounceTmr);
    debounceTmr = setTimeout(function(){
      _searchTerm = v;
      applyFilters();
    }, 120);
  });

  if($clear){
    $clear.addEventListener("click", function(){
      $input.value = "";
      _searchTerm = "";
      $clear.style.display = "none";
      applyFilters();
      $input.focus();
    });
  }
}

function errMsg(msg){
  setMsg(msg);
  $overlay.style.display = "flex";
  toast(msg, "err", 0);
}

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = {"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2,"5:4":5/4,"2:1":2};
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

function injectControls(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;

  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx  = 0;
  var fitBtn  = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title     = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }

  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirstFrame(){
    vid.removeEventListener("timeupdate", onFirstFrame);
    updateRatio();
  });
  updateRatio();

  return true;
}

async function startPlayer(ch){
  $pc.style.display = "flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    errMsg("Browser Not Supported.");
    return;
  }

  var player = new shaka.Player();
  await player.attach($vid);

  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements:[
      "play_pause","mute","volume",
      "time_and_duration","spacer",
      "quality","picture_in_picture","fullscreen"
    ],
    seekBarColors:{base:"#828282", buffered:"#ffc336", played:"#1fc7ff"}
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  var cookie   = ch.cookie || "";
  var raw      = rawCookie(cookie);
  var url      = ch.stream_url;
  var drmKeys  = buildClearKeys(ch);
  var keyCount = Object.keys(drmKeys).length;

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  if(keyCount === 0){
    toast("No DRM Keys Available","err",0);
    return;
  }

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      drm:{ clearKeys: drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  player.configure(buildCfg());

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    if(cookie) req.headers["Cookie"] = cookie;
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["Origin"]     = "https://www.jiotv.com/";
    req.headers["User-Agent"] = ch.headers && ch.headers["User-Agent"]
      ? ch.headers["User-Agent"]
      : "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    if(ch.headers){
      Object.keys(ch.headers).forEach(function(k){
        if(!req.headers[k]) req.headers[k] = ch.headers[k];
      });
    }
    if(raw && (type === T.MANIFEST || type === T.SEGMENT))
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false;
  var retries    = 0;
  var edgeTried  = false;
  var lastTry    = 0;
  var started    = false;
  var stallTmr   = null;

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{
      player.goToLive();
      edgeTried = true;
      toast("Syncing To Live Edge…","warn",2000);
    }catch(_){ reload(); }
  }

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
    refreshing = true; lastTry = now; retries++;
    toast("Reconnecting… (" + retries + " / 5)","warn",0);
    try{
      var d     = await loadData();
      var fresh = d.channels.find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      var freshKeys = buildClearKeys(fresh);
      if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
      cookie  = fresh.cookie || "";
      raw     = rawCookie(cookie);
      drmKeys = freshKeys;
      url     = fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries = 0; edgeTried = false;
      toast("Live","live",4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{ refreshing = false; }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err  = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Quality…","warn",2000);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("Live","live",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    } else {
      toast(shakaErrStr(err),"err",6000);
    }
  });

  try{
    setMsg("Loading Stream…");
    toast("Loading Stream…","warn",0);
    await player.load(url);
    hideOverlay();
    toast("Ready — Tap ▶ To Play","ok",5000);
  }catch(e){
    hideOverlay();
    toast("Connection Error — Retrying…","warn",0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(stallTmr) return;
    toast("Buffering…","warn",0);
    if(!started || refreshing) return;
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!edgeTried) goLiveEdge(); else reload();
    }, 5000);
  }

  function onPlaying(){
    started = true;
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
    edgeTried = false;
    if(!refreshing) toast("Live","live",3000);
  }

  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("error",   function(){
    if(!refreshing){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      setTimeout(function(){
        if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      }, 400);
    }
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
    });
  }
}

/* ═══════════ BUILD CLEAR KEYS — MULTI-PAIR SUPPORT ═══════════
   Handles:
   - sportlink array (from #KODIPROP license_key, comma-split already done in parser)
   - Each entry may be "kid:key" and can have hyphens or colons inside
*/
function buildClearKeys(ch){
  var out = {};

  // 1) sportlink array (each entry is "kid:key")
  if(Array.isArray(ch.sportlink) && ch.sportlink.length > 0){
    ch.sportlink.forEach(function(entry){
      if(typeof entry !== "string") return;
      var idx = entry.indexOf(":");
      if(idx === -1) return;
      var kid = entry.slice(0, idx).trim().toLowerCase();
      var key = entry.slice(idx + 1).trim().toLowerCase();
      if(kid && key) out[kid] = key;
    });
  }

  // 2) legacy single key_id/key fields
  if(Object.keys(out).length === 0 && isNonEmpty(ch.key_id) && isNonEmpty(ch.key)){
    out[ch.key_id.trim().toLowerCase()] = ch.key.trim().toLowerCase();
  }

  return out;
}

async function main(){
  var id = getChId(), data;

  try{
    setMsg("Fetching Channels…");
    data = await loadData();
  }catch(e){
    errMsg("Connection Error. Please Check Your Internet.");
    return;
  }

  if(!id){
    setupSearch();
    renderList(data.channels);
    return;
  }

  var ch = data.channels.find(function(c){ return c.id === id; });
  if(!ch){
    errMsg("Channel Not Found.");
    return;
  }

  document.title = ch.name;
  await startPlayer(ch);
}

document.addEventListener("DOMContentLoaded", main);
})();
